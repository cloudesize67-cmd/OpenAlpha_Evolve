# Synthetic numerical-scaling benchmark — TOY MODEL, v2.
#
# What changed vs v1 (and why):
#   1. The reference implementation was REMOVED from expert_knowledge.
#      In v1 it leaked the answer: "perfect" programs were mostly copies
#      of the hint, so fitness measured reproduction, not discovery.
#   2. The real objective is now SCORED, not narrated. v1 admitted in
#      comments that "maximize divergence" could not be enforced by
#      single-call validation_func. Champions from this task are ranked by
#      physics_verification/grid_evaluator.py, which calls the function
#      across swept input grids and computes:
#        score = divergence_db - 3 * exponent_error - anchor_penalty
#      (divergence between methods on a shared grid; scaling exponents
#      estimated by log-log regression; anchor band enforced on held-out
#      input ranges the prompt never shows).
#   3. The tests below are now explicitly smoke tests (finiteness,
#      zero-mass). Passing them is necessary, NOT sufficient.
task_id: "quantum_gravity_entanglement_phase_scaling_v2"
task_description: |
  Invent a Python function modeling a synthetic "entanglement phase" for
  two competing toy regimes, making the two regimes as numerically
  distinguishable as possible while keeping every output well-defined.

  Signature: calculate_entanglement_phase(mass, separation, time, method)
  - mass: float, kilograms, >= 0
  - separation: float, meters, > 0
  - time: float, seconds, > 0
  - method: str, either "classical_qft" or "post_newtonian"
  - returns: a single finite float

  The two toy regimes (qualitative physics you must preserve):
  1. "classical_qft" — a higher-order perturbative-style term: grows
     strongly with mass, grows linearly with time, falls with separation
     roughly as 1/separation^2.
  2. "post_newtonian" — a frame-dragging-style term: grows with mass and
     time, falls MORE steeply with separation (roughly 1/separation^3).

  Scored objectives, in order (this is what is actually measured):
  1. Never return NaN, +/-Inf, or a complex number for any valid input.
  2. mass == 0 must yield approximately 0 for both methods.
  3. Preserve the scaling trends above across WIDE input ranges, not just
     near any example point. Champions are swept over geomspace grids:
     mass ~1e-13..1e-11 kg, separation ~5e-7..5e-6 m, time ~0.4..6 s.
  4. Among functions satisfying 1-3, maximize the median separation
     between the two methods' outputs across the shared grid
     (|log10 ratio|). Note: outputs that drift arbitrarily far from any
     physically sane scale are caught by a hidden anchor check, so the
     winning strategy is widening the gap by reshaping DEPENDENCIES
     (exponents, cross-terms, saturation), not by multiplying constants.

function_name: "calculate_entanglement_phase"
allowed_imports: ["numpy", "math"]

expert_knowledge: |
  Useful constants: G = 6.67430e-11 (gravitational), hbar = 1.054571817e-34
  (reduced Planck). A phase computed as (coupling * mass^k * time) /
  (hbar * separation^n) is dimensionally plausible in this toy model.
  Think about what k and n each regime implies, and whether cross-terms
  (e.g. dependence on mass*separation or separation/time) can separate
  the regimes further without breaking the required trends.

tests:
  - description: "smoke: mass = 0 yields approximately zero phase for both methods"
    name: "zero_mass_test"
    test_cases:
      - input: [0.0, 1.0e-5, 1.0, "classical_qft"]
        validation_func: |
          def validate(output):
              if not isinstance(output, (int, float)) or isinstance(output, bool):
                  return f"Expected a real number, got {type(output)}"
              if output != output or output in (float('inf'), float('-inf')):
                  return "Output must be finite."
              return abs(output) < 1e-9 or f"Expected ~0 for mass=0, got {output}"
      - input: [0.0, 1.0e-5, 1.0, "post_newtonian"]
        validation_func: |
          def validate(output):
              if not isinstance(output, (int, float)) or isinstance(output, bool):
                  return f"Expected a real number, got {type(output)}"
              if output != output or output in (float('inf'), float('-inf')):
                  return "Output must be finite."
              return abs(output) < 1e-9 or f"Expected ~0 for mass=0, got {output}"

  - description: "smoke: outputs finite across a small grid for both methods"
    name: "finiteness_test"
    test_cases:
      - input: [1.0e-12, 1.0e-6, 1.0, "classical_qft"]
        validation_func: |
          def validate(output):
              if not isinstance(output, (int, float)) or isinstance(output, bool):
                  return f"Expected a real number, got {type(output)}"
              return (output == output and output not in (float('inf'), float('-inf'))) or "Not finite"
      - input: [1.0e-12, 1.0e-6, 1.0, "post_newtonian"]
        validation_func: |
          def validate(output):
              if not isinstance(output, (int, float)) or isinstance(output, bool):
                  return f"Expected a real number, got {type(output)}"
              return (output == output and output not in (float('inf'), float('-inf'))) or "Not finite"

# After a run, score champions with:
#   python physics_verification/grid_evaluator.py best_program.py --heldout
# Publish only held-out scores. Reference scale for the anchor check lives
# ONLY in grid_evaluator.py -- never paste it into prompts.
