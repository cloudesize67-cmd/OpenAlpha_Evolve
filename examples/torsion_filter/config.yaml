# config.yaml -- OpenEvolve settings for the torsion-balance denoise task.
# Cost discipline: cheap model for mass generation, strong model only for
# elite refinement. Adjust model names to whatever you actually pay for.

max_iterations: 60
checkpoint_interval: 10

llm:
  # Breadth: cheapest available model generates most candidates
  primary_model: "gemini-3.5-flash-lite"
  primary_model_weight: 0.8
  # Depth: strong model refines current elites only
  secondary_model: "claude-sonnet-5"
  secondary_model_weight: 0.2
  api_base: null            # set per your provider/router
  temperature: 0.7

prompt:
  system_message: |
    You are improving a digital filter for a torsion-balance readout.
    Rewrite ONLY the code inside EVOLVE-BLOCK markers.
    Keep the signature apply_filter(noisy, fs) -> np.ndarray, same length out.
    Goal: maximize SNR at the known 5 Hz target while preserving its
    amplitude (<=3 dB attenuation) and staying robust across noise seeds.
    Do NOT try to read, import, or infer the evaluator's seeds or test
    data; optimize the general problem, not the test.
  num_suggestions: 4

database:
  population_size: 16
  num_islands: 3
  elite_selection: "fitness"

evaluator:
  cascade_evaluation: true
  timeout: 60

# Reminder: combined_score is dB relative to a tuned human baseline
# (4th-order lowpass @ 12 Hz). combined_score > 0 = beats the engineer.
